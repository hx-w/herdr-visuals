id = "hx-w.visuals"
name = "Visuals"
version = "0.2.0"
description = "Preview Mermaid, LaTeX and local images through native Kitty graphics."
min_herdr_version = "0.9.2"
platforms = ["macos", "linux"]

[[build]]
command = ["npm", "ci", "--ignore-scripts"]

[[build]]
command = ["npm", "run", "setup"]

[[actions]]
id = "open"
title = "Visual previews"
description = "Open or focus previews; close when already focused."
command = ["node", "src/launch.mjs"]

[[actions]]
id = "example"
title = "Visuals example"
description = "Preview the bundled sample diagram and equations."
command = ["node", "src/launch.mjs", "--example"]

[[panes]]
id = "viewer"
title = "Visuals"
placement = "split"
command = ["sh", "-c", "exec node \"$HERDR_PLUGIN_ROOT/src/viewer.mjs\""]
